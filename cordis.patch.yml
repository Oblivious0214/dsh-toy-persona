# dsh-toy-persona bundle patch: one host-plane row.
#
# The row is host-plane on purpose: it must see every agent and be able to reach
# each agent's own prompt registry. A row mounted INSIDE a preset realm cannot do
# either.
#
# A role is NOT an agent preset. Nothing here imports `@deepseek-ai/dsh-agent-preset`
# and nothing is registered with the preset registry — that is the whole point of
# the plugin, and `npm run verify` fails if it regresses. Applying a role registers
# a single prompt section (`persona-switcher:persona`) on that ONE agent, so the
# deployment's tools, skills, model route and plugin composition are untouched.
- insert:
    - id: persona-switcher
      name: 'dsh-toy-persona'
      config:
        # Empty means "unset": the row then uses <DSH_HOME>/roles. Writing the
        # environment variable this way keeps `undefined` (no variable) and `''`
        # (variable set to nothing) the same answer.
        rolesDir: !!js process.env.DSH_ROLES_DIR || ''